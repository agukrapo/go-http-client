name: Main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  Main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Code checkout
        uses: actions/checkout@v7

      - name: Go setup
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install build dependencies
        run: make deps

      - name: Code format
        run: make format && git diff --exit-code

      - name: Code test
        run: make test

      - name: Code lint
        run: make lint

      - name: Tagger
        uses: agukrapo/tagger@v0.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
